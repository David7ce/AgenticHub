<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<!--SHARED_CSS-->
</head>
<body>
<div class="wrap">
  <!--SHELL-->

  <details class="card cal" id="calendar" open>
<!--CALENDAR-->
  </details>

  <section class="card usage-preview" id="usagePreview" hidden>
    <div class="usage-head">
      <div>
        <h2 data-i18n="tokenUsage"></h2>
        <p class="note">
          <span data-i18n="usageSnapshot"></span>: <span id="usageDate"></span>
          · <span data-i18n="commitsTracked"></span>: <span id="usageCommits"></span>
        </p>
      </div>
      <a class="open" href="ai-usage.html" data-i18n="usageDetails"></a>
    </div>
    <div class="usage-agents" id="usageAgents"></div>
  </section>

  <div class="toolbar">
    <input id="q" class="search" type="text" data-i18n-placeholder="search" data-i18n-title="searchTitle">
    <select id="owner"></select>
    <div class="segmented" role="group">
      <button type="button" class="tool" id="workingOnly" aria-pressed="false" data-i18n="working" data-i18n-title="workingLabelTitle"></button>
      <button type="button" class="tool" id="clonesOnly" aria-pressed="false" data-i18n="gitClones" data-i18n-title="clonesOnlyTitle"></button>
    </div>
    <button id="syncBtn" class="tool" type="button"></button>
    <span class="count" id="count"></span>
  </div>
  <div class="table-wrap">
    <table id="reposTable">
      <thead><tr>
        <th data-sort="owner"><span data-i18n="owner"></span><span class="arrow"></span></th>
        <th data-sort="project"><span data-i18n="project"></span><span class="arrow"></span></th>
        <th data-sort="name"><span data-i18n="name"></span><span class="arrow"></span></th>
        <th data-sort="pending" data-i18n-title="statusTitle"><span data-i18n="status"></span><span class="arrow"></span></th>
        <th data-i18n="local"></th>
        <th data-sort="remoteHost"><span data-i18n="remote"></span><span class="arrow"></span></th>
        <th data-sort="stars" data-i18n-title="starsTitle"><span data-i18n="stars"></span><span class="arrow"></span></th>
        <th data-sort="created"><span data-i18n="started"></span><span class="arrow"></span></th>
        <th data-sort="lastCommit"><span data-i18n="lastCommit"></span><span class="arrow"></span></th>
        <th data-sort="shownCommits" data-i18n-title="commitsTitle"><span id="commitsLabel"></span><span class="arrow"></span></th>
      </tr></thead>
      <tbody id="reposBody"></tbody>
    </table>
  </div>
</div>
<div id="tooltip" role="tooltip"></div>
<!--PAGE_DATA-->
<!--SHARED_JS-->
</body>
</html>
