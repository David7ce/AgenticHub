name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    # The hub is Windows-first: path translation, the OpenCode launcher and the
    # sandbox assumptions are exercised there. A Linux job would test a shape
    # nobody runs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Credentials never enter tracked files
        run: node tools/secret-scan.mjs --all

      - name: Documentation, hub tests and bench dry-run
        run: node tools/check.mjs

